schema_version: "1.0"
module_id: ar
module_name: 应收管理
prd_roots:
  - "${PRD_WORKSPACE}/prd"
include_paths:
  - "应收业务单别/"
  - "应收业务单别参数/"
  - "应收参数/"
  - "应收单/"
  - "其他应收单/"
  - "应收启用期间/"
  - "会计期间表/"
  - "会计期间信息/"
  - "结算业务单别/"
  - "结算业务单别参数/"
scenario_sources:
