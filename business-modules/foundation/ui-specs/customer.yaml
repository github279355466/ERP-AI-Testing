schema_version: "1.0"
module_id: foundation
page_key: customer
page_name: 客户通用信息
page_type: master
source_ref:
  document_id: UI-SPEC-TEMPLATE
  file_path: docs/UI规范/ERP-UI规范.md
  source_type: UI_OBSERVED
  excerpt: 界面规范基线：字段与列的排列、分组、显示格式、按钮排列
expectations:
  list:
    tabs:
      required:
        - 全部
        - 生效
        - 失效
        - 未生效
      allow_extra: true
    columns:
      order:
        - 序号
        - 客户编号
        - 客户名称
        - 客户简称
        - 客户性质
        - 状态
        - 操作
      allow_extra: true
    batch_actions:
      order:
        - 生效
        - 取消生效
        - 失效
        - 重新生效
        - 删除
    actions_by_status:
      生效:
        - 查看
        - 编辑
        - 取消生效
        - 失效
        - 删除
      未生效:
        - 查看
        - 编辑
        - 生效
        - 删除
    status_colors:
      生效: green
      未生效: yellow
      失效: gray
    pagination:
      required_text:
        - 条/页
  detail:
    banner:
      require_single_number: false
      max_totals: 0
      totals: []
    header_groups:
      order:
        - 基本信息
        - 通用信息
        - 属性信息
      allow_extra: true
    field_layout:
      order:
        - 客户编号
        - 客户简称
        - 客户群组
        - 客户性质
        - 客户名称
        - 快捷码
        - 税号
        - 年营业额(人民币:万元)
        - 注册资本(人民币：万元)
        - 开业日期
        - 负责人名称
        - 公司电话
        - 邮箱
        - 网址
        - 员工人数
        - 停业日期
        - 潜客编号
        - 备注
        - 营业执照
      groups:
        - title: 基本信息
          fields:
            - 客户编号
            - 客户简称
            - 客户群组
            - 客户性质
            - 客户名称
            - 快捷码
        - title: 通用信息
          fields:
            - 税号
            - 年营业额(人民币:万元)
            - 注册资本(人民币：万元)
            - 开业日期
            - 负责人名称
            - 公司电话
            - 邮箱
            - 网址
            - 员工人数
            - 停业日期
            - 潜客编号
            - 备注
            - 营业执照
      lookup_fields:
        - 客户群组
    grid:
      required: false
      columns: []
    lookup_input:
      require_manual_entry: true
      require_fuzzy_query: true
      max_fields: 3
    bottom_actions:
      order:
        - 删除
        - 重新生效
        - 失效
        - 取消生效
        - 生效
        - 复制
        - 新增
        - 编辑
        - 取消
        - 保存并新增
        - 保存
