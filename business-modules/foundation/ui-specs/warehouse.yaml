schema_version: "1.0"
module_id: foundation
page_key: warehouse
page_name: 仓库信息
page_type: master
source_ref:
  document_id: UI-SPEC-TEMPLATE
  file_path: docs/UI规范/ERP-UI规范.md
  source_type: UI_OBSERVED
  excerpt: 界面规范基线：字段与列的排列、分组、显示格式、按钮排列
expectations:
  list:
    tabs:
      required:
        - 全部
        - 生效
        - 失效
      allow_extra: true
    columns:
      order:
        - 序号
        - 运营单元编号
        - 运营单元名称
        - 仓库编号
        - 仓库名称
        - 仓库性质
        - 纳入可用量计算
        - 允许负库存
        - 储位管理
        - 地址
        - 联系电话
        - 传真
        - 状态
        - 操作
      allow_extra: true
    batch_actions:
      order:
        - 生效
        - 失效
        - 删除
    actions_by_status:
      生效:
        - 查看
        - 编辑
        - 失效
        - 删除
    status_colors:
      生效: green
      未生效: yellow
      失效: gray
    pagination:
      required_text:
        - 条/页
  detail:
    banner:
      require_single_number: false
      max_totals: 0
      totals: []
    header_groups:
      order:
        - 仓库
        - 储位
      allow_extra: true
    field_layout:
      order:
        - 运营单元
        - 仓库性质
        - 联系电话
        - 传真
        - 仓库编号
        - 纳入可用量计算
        - 允许负库存
        - 地址
        - 仓库名称
        - 储位管理
        - 备注
      groups:
        - title: 仓库
          fields:
            - 运营单元
            - 仓库性质
            - 联系电话
            - 传真
            - 仓库编号
            - 纳入可用量计算
            - 允许负库存
            - 地址
            - 仓库名称
            - 储位管理
            - 备注
      lookup_fields:
        - 运营单元
    grid:
      required: true
      columns:
        - 序号
        - 储位编号
        - 储位名称
        - 备注
    lookup_input:
      require_manual_entry: true
      require_fuzzy_query: true
      max_fields: 3
    bottom_actions:
      order:
        - 删除
        - 失效
        - 生效
        - 复制
        - 新增
        - 编辑
        - 取消
        - 保存并新增
        - 保存
